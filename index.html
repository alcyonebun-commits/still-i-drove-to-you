<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Milan's iPhone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #181818;
font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
color: white;
overflow: hidden;
padding-top: 0;
box-sizing: border-box;
}

.phone {
  position: relative;
  width: min(100vw, 390px);
  height: min(100dvh, 844px);
  min-height: 580px;
  overflow: hidden;
  background: #111;
}

.wallpaper {
  position: absolute;
  inset: 0;
  background-image: url('./wallpaper.png');
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  z-index: 0;
}

.status {
  position: absolute;
  z-index: 10;
  top: 14px;
  left: 25px;
  right: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  font-weight: 600;
}

.dynamic-island {
  position: absolute;
  z-index: 11;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 29px;
  background: #050505;
  border-radius: 25px;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
}

.screen.active {
  display: block;
}

.lock-content {
  position: absolute;
  top: 15%;
  width: 100%;
  text-align: center;
}

.date {
font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
font-size: 17px;
font-weight: 500;
letter-spacing: -0.3px;
margin-bottom: 5px;
text-shadow: 0 2px 8px #222;
}

.clock {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: clamp(68px, 20vw, 88px);
  line-height: 1.05;
  font-weight: 200;
  letter-spacing: -3px;
  text-shadow: 0 2px 12px #222;
  font-variant-numeric: tabular-nums;
}

.lock-message {
margin-top: 22px;
font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
font-size: 13px;
font-weight: 400;
letter-spacing: 0.2px;
color: rgba(255, 255, 255, 0.9);
text-shadow: 0 1px 6px #222;
}

.swipe-area {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 115px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 27px;
  gap: 12px;
  font-size: 12px;
  color: white;
  background: linear-gradient(transparent, #0002);
  cursor: pointer;
}

.home-indicator {
  position: absolute;
  z-index: 20;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 135px;
  height: 5px;
  border-radius: 8px;
  background: white;
}

.passcode-screen {
  background: #202126;
  text-align: center;
  padding-top: 95px;
}

.pass-title {
  font-size: 22px;
  font-weight: 600;
}

.pass-subtitle {
  font-size: 13px;
  color: #bbb;
  margin-top: 10px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 17px;
  margin: 30px 0 18px;
}

.dot {
  width: 12px;
  height: 12px;
  border: 1px solid white;
  border-radius: 50%;
}

.dot.filled {
  background: white;
}

.error {
  height: 20px;
  color: #ff7777;
  font-size: 12px;
}

.keypad {
  width: 270px;
  margin: 15px auto 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px 18px;
}

.key {
  width: 76px;
  height: 76px;
  border: 0;
  border-radius: 50%;
  background: #414248;
  color: white;
  font-size: 29px;
  font-weight: 300;
  cursor: pointer;
}

.key:active {
  background: #73747a;
}

.key small {
  display: block;
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 2px;
}

.key.empty {
  visibility: hidden;
}

.key.action {
  background: transparent;
  font-size: 13px;
}

.home-screen {
  background: linear-gradient(155deg, #8295a0, #343c53 60%, #1d2336);
  padding: 70px 24px 35px;
}

.welcome {
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -1px;
  margin-bottom: 5px;
}

.home-date {
  color: #e0e4e8;
  font-size: 13px;
  margin-bottom: 32px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 12px;
}

.app {
  text-align: center;
  font-size: 11px;
  cursor: pointer;
}

.app-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  border-radius: 15px;
  background: #f5f5f5;
  box-shadow: 0 3px 9px #0002;
}

.dock {
  position: absolute;
  bottom: 28px;
  left: 18px;
  right: 18px;
  padding: 13px 8px;
  border-radius: 25px;
  background: #ffffff30;
  backdrop-filter: blur(18px);
  display: flex;
  justify-content: space-around;
}

.dock .app-icon {
  margin-bottom: 0;
}

.toast {
  position: absolute;
  z-index: 30;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 16px;
  border-radius: 20px;
  background: #333;
  font-size: 12px;
  white-space: nowrap;
  display: none;
}
</style>
</head>

<body>
<div class="phone" id="phone">

  <div class="wallpaper"></div>
  <div class="dynamic-island"></div>

  <div class="status">
    <span id="statusTime">9:41</span>
    <span>●●● ▰</span>
  </div>

  <div class="toast" id="toast"></div>

  <!-- LOCK SCREEN -->
  <section class="screen active" id="lockScreen">
    <div class="lock-content">
      <div class="date" id="lockDate">Sunday, October 25</div>
      <div class="clock" id="lockClock">09:41</div>
      <div class="lock-message">🔒 &nbsp; iPhone Locked</div>
    </div>

    <div class="swipe-area" id="swipeArea">
      <span>▲</span>
      <span>Swipe up to unlock</span>
    </div>
  </section>

  <!-- PASSCODE SCREEN -->
  <section class="screen passcode-screen" id="passScreen">
    <div style="font-size:35px;margin-bottom:12px">🔒</div>
    <div class="pass-title">Enter Passcode</div>
    <div class="pass-subtitle">Enter the passcode to unlock Milan's iPhone.</div>

    <div class="dots" id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="error" id="error"></div>

    <div class="keypad">
      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2<small>ABC</small></button>
      <button class="key" data-num="3">3<small>DEF</small></button>

      <button class="key" data-num="4">4<small>GHI</small></button>
      <button class="key" data-num="5">5<small>JKL</small></button>
      <button class="key" data-num="6">6<small>MNO</small></button>

      <button class="key" data-num="7">7<small>PQRS</small></button>
      <button class="key" data-num="8">8<small>TUV</small></button>
      <button class="key" data-num="9">9<small>WXYZ</small></button>

      <button class="key action" id="cancel">Cancel</button>
      <button class="key" data-num="0">0</button>
      <button class="key action" id="delete">Delete</button>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section class="screen home-screen" id="homeScreen">
    <div class="welcome">Good morning, Milan.</div>
    <div class="home-date" id="homeDate">Your little corner of the world.</div>

    <div class="app-grid">
      <div class="app" data-app="Photos">
        <div class="app-icon">🌅</div>Photos
      </div>
      <div class="app" data-app="Messages">
        <div class="app-icon">💬</div>Messages
      </div>
      <div class="app" data-app="Notes">
        <div class="app-icon">📝</div>Notes
      </div>
      <div class="app" data-app="Calendar">
        <div class="app-icon">📅</div>Calendar
      </div>
      <div class="app" data-app="Music">
        <div class="app-icon">🎵</div>Music
      </div>
      <div class="app" data-app="Settings">
        <div class="app-icon">⚙️</div>Settings
      </div>
      <div class="app" data-app="Diary">
        <div class="app-icon">📔</div>Diary
      </div>
      <div class="app" data-app="Contacts">
        <div class="app-icon">👥</div>Contacts
      </div>
    </div>

    <div class="dock">
      <div class="app" data-app="Phone">
        <div class="app-icon">📞</div>
      </div>
      <div class="app" data-app="Messages">
        <div class="app-icon">💬</div>
      </div>
      <div class="app" data-app="Safari">
        <div class="app-icon">🧭</div>
      </div>
      <div class="app" data-app="Music">
        <div class="app-icon">🎵</div>
      </div>
    </div>
  </section>

  <div class="home-indicator" id="homeIndicator"></div>
</div>

<script>
const lockScreen = document.getElementById("lockScreen");
const passScreen = document.getElementById("passScreen");
const homeScreen = document.getElementById("homeScreen");
const error = document.getElementById("error");
const dots = document.querySelectorAll(".dot");

let entered = "";
let startY = 0;

function showScreen(screen) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.remove("active");
  });
  screen.classList.add("active");
}

function openPasscode() {
  entered = "";
  updateDots();
  error.textContent = "";
  showScreen(passScreen);
}

document.getElementById("swipeArea").addEventListener("click", openPasscode);

document.getElementById("lockScreen").addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
}, {passive:true});

document.getElementById("lockScreen").addEventListener("touchend", e => {
  const endY = e.changedTouches[0].clientY;
  if (startY - endY > 35) openPasscode();
}, {passive:true});

document.querySelectorAll("[data-num]").forEach(button => {
  button.addEventListener("click", () => {
    if (entered.length >= 4) return;

    entered += button.dataset.num;
    updateDots();

    if (entered.length === 4) {
      setTimeout(checkPasscode, 180);
    }
  });
});

function updateDots() {
  dots.forEach((dot, index) => {
    dot.classList.toggle("filled", index < entered.length);
  });
}

function checkPasscode() {
  if (entered === "1524") {
    error.textContent = "";
    showScreen(homeScreen);
  } else {
    error.textContent = "Incorrect passcode. Try again.";
    entered = "";
    updateDots();
  }
}

document.getElementById("delete").addEventListener("click", () => {
  entered = entered.slice(0, -1);
  error.textContent = "";
  updateDots();
});

document.getElementById("cancel").addEventListener("click", () => {
  entered = "";
  updateDots();
  error.textContent = "";
  showScreen(lockScreen);
});

document.querySelectorAll("[data-app]").forEach(app => {
  app.addEventListener("click", () => {
    const name = app.dataset.app;
    const toast = document.getElementById("toast");
    toast.textContent = name + " — coming soon";
    toast.style.display = "block";
    setTimeout(() => toast.style.display = "none", 1800);
  });
});

function updateTime() {
  const now = new Date();
  document.getElementById("statusTime").textContent =
    now.toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", hour12:false});

  document.getElementById("lockClock").textContent =
    now.toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", hour12:false});

  document.getElementById("lockDate").textContent =
    now.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});

  document.getElementById("homeDate").textContent =
    now.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});
}

updateTime();
setInterval(updateTime, 10000);
</script>

</body>
</html>
